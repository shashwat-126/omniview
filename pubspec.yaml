name: omniview
description: Private, offline universal file viewer. No accounts, no analytics, no uploads.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  file_picker: ^13.1.0
  cross_file: ^0.3.4
  shared_preferences: ^2.2.3
  flutter_markdown: ^0.7.1
  csv: ^6.0.0
  archive: ^4.3.0
  pdfrx: ^2.6.4
  path_provider: ^2.1.3
  crypto: ^3.0.3
  xml: ^6.5.0
  two_dimensional_scrollables: ^0.3.3
  flutter_svg: ^2.0.10
  image: ^4.2.0
  libre_office_kit_converter_plugin: ^0.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
